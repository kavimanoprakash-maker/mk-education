<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interjection - MK Education Centre</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Additional styles for quiz page */
        .quiz-header {
            background: linear-gradient(135deg, #171650 0%, #243924 100%);
            padding: 2rem;
            border-radius: 10px;
            margin-bottom: 2rem;
            position: relative;
            overflow: hidden;
        }
        
        .quiz-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #86fcbb, #03dac6, #86fcbb);
        }
        
        .topic-title {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 10px;
        }
        
        .topic-title i {
            font-size: 2.5rem;
            color: #86fcbb;
        }
        
        .topic-meta {
            display: flex;
            gap: 20px;
            margin-top: 15px;
            flex-wrap: wrap;
        }
        
        .meta-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
        }
        
        .question-counter {
            position: fixed;
            bottom: 80px;
            right: 20px;
            background: #86fcbb;
            color: #121212;
            padding: 10px 15px;
            border-radius: 50px;
            z-index: 100;
            box-shadow: 0 4px 12px rgba(134, 252, 187, 0.3);
            font-weight: bold;
        }
        
        .question-nav {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 2rem 0;
            flex-wrap: wrap;
        }
        
        .page-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--card-bg);
            border: 1px solid #444;
            color: var(--text);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }
        
        .page-btn:hover {
            background: #86fcbb;
            color: #121212;
        }
        
        .page-btn.active {
            background: #86fcbb;
            color: #121212;
        }
        
        .page-btn.answered {
            background: var(--correct);
            color: white;
        }
        
        .page-btn.incorrect {
            background: var(--wrong);
            color: white;
        }
        
        /* Back to Top button for quiz pages */
        .back-to-top-quiz {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            background: #86fcbb;
            color: #121212;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
            z-index: 1000;
            box-shadow: 0 4px 12px rgba(134, 252, 187, 0.3);
        }
        
        .back-to-top-quiz.show {
            opacity: 1;
            visibility: visible;
        }
        
        .back-to-top-quiz:hover {
            background: #5af5b5;
            transform: translateY(-3px);
            box-shadow: 0 6px 16px rgba(134, 252, 187, 0.4);
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="main-nav">
        <div class="nav-container">
            <div class="logo">
                <a href="index.html" style="color: inherit; text-decoration: none;">
                    <i class="fas fa-graduation-cap"></i>
                    <span>MK Education Centre</span>
                </a>
            </div>
            <div class="nav-links">
                <a href="#" onclick="resetProgress()"><i class="fas fa-redo"></i></a>
            </div>
        </div>
    </nav>

    <!-- Quiz Header -->
    <<div class="quiz-header">
        <div class="quiz-header">
            <div class="topic-title">
                <i class="fas fa-exclamation-circle"></i>
                <div>
                    <h1>Interjection (உணர்ச்சிக் குறிப்புச் சொல்)</h1>
                </div>
            </div>
        </div>

        <!-- Progress -->
        <div class="progress-container">
            <div class="progress-header">
                <span>உங்கள் முன்னேற்றம்:</span>
                <span id="progress-text">0/80</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill" style="background: linear-gradient(90deg, #86fcbb, #03dac6);"></div>
            </div>
        </div>

        <!-- Stats -->
        <div class="stats">
            <div class="stat-item">
                <div class="stat-value" id="total-questions" style="color: #86fcbb;">80</div>
                <div class="stat-label">மொத்த கேள்விகள்</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="answered" style="color: #86fcbb;">0</div>
                <div class="stat-label">பதிலளிக்கப்பட்டவை</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="correct" style="color: #86fcbb;">0</div>
                <div class="stat-label">சரியான பதில்கள்</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="percentage" style="color: #86fcbb;">0%</div>
                <div class="stat-label">வெற்றி விகிதம்</div>
            </div>
        </div>

        <!-- Question Navigation -->
        <div class="question-nav" id="question-nav">
            <!-- Page buttons will be generated by JavaScript -->
        </div>

        <!-- Controls -->
        <div class="controls">
            <button class="btn btn-secondary" onclick="window.location.href='Conjunction.html'">
                <i class="fas fa-arrow-left"></i> முந்தைய தலைப்பு
            </button>
            <button class="btn btn-secondary" onclick="window.location.href='index.html'">
                <i class="fas fa-home"></i> முகப்பு
            </button>

            <button class="btn btn-primary" onclick="window.location.href='Direct_Indirect_Speech.html'" style="background: #86fcbb; color: #121212;">
                 அடுத்த தலைப்பு <i class="fas fa-arrow-right"></i>
            </button>
        </div>

        <!-- INTERJECTION QUESTIONS SECTION -->
        <section class="topic-section" id="interjection-section">
            <h2 class="topic-header" style="color: #86fcbb; border-bottom-color: #86fcbb;">
                <i class="fas fa-question-circle"></i> Interjection கேள்விகள்
            </h2>
            <div class="qa-container" id="interjection-qa">
                <!-- Questions will be loaded by JavaScript -->
            </div>
        </section>

        <!-- Question Counter -->
        <div class="question-counter">
            <span id="current-question">1</span>/<span id="total-question">80</span>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <div class="footer-bottom">
            <p>&copy; 2026 MK Education Centre. </p>
            <p>Interjection Practice Questions.</p>
        </div>
    </footer>

    <!-- Back to Top Button -->
    <button id="backToTop" class="back-to-top-quiz">
        <i class="fas fa-arrow-up"></i>
    </button>

    <script src="questions.js"></script>
    <script src="script.js"></script>
    
</body>
</html>
