<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MK Education Centre - Today's Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --border: #30363d;
    --gold: #f0c040;
    --teal: #39d0c8;
    --text: #e6edf3;
    --muted: #8b949e;
    --nav-h: 70px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  nav {
    position: fixed; top: 0; left: 0; right: 0;
    height: var(--nav-h);
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px;
    z-index: 1000;
    box-shadow: 0 2px 12px rgba(0,0,0,0.3);
  }
  .nav-left { display: flex; flex-direction: column; gap: 3px; }
  .nav-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.3rem; font-weight: 900;
    color: var(--gold); letter-spacing: 0.5px;
    display: flex; align-items: center; gap: 10px;
  }
  .nav-title span.dot { color: var(--teal); font-size: 1.4rem; }
  .nav-sub { font-size: 0.72rem; font-weight: 600; color: var(--muted); padding-left: 2px; }
  main {
    padding-top: calc(var(--nav-h) + 40px);
    max-width: 720px;
    margin: 0 auto;
    padding-left: 20px;
    padding-right: 20px;
    padding-bottom: 60px;
    text-align: center;
  }
  .badge {
    display: inline-block;
    background: linear-gradient(135deg, rgba(240,192,64,0.15), rgba(57,208,200,0.15));
    border: 2px solid var(--gold);
    border-radius: 12px;
    padding: 6px 18px;
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--gold);
    margin-bottom: 20px;
  }
  h1 {
    font-family: 'Playfair Display', serif;
    font-size: 1.8rem;
    color: var(--teal);
    margin-bottom: 12px;
  }
  p {
    color: var(--muted);
    font-size: 0.95rem;
    line-height: 1.7;
    margin-bottom: 30px;
  }
  .back-btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 12px 24px;
    background: var(--surface);
    border: 1.5px solid var(--teal);
    color: var(--teal);
    border-radius: 10px;
    font-weight: 700;
    font-size: 0.92rem;
    text-decoration: none;
    transition: opacity 0.2s;
  }
  .back-btn:hover { opacity: 0.8; }
</style>
</head>
<body>
<nav>
  <div class="nav-left" onclick="window.location.href='mk_quiz_all.html?from=today'" style="cursor:pointer;" title="Home">
    <div class="nav-title"><span class="dot">🎓</span> MK Education Centre</div>
    <div class="nav-sub" id="nav-dt"></div>
  </div>
</nav>
<main>
  <div class="badge">⭐ Today's Quiz</div>
  <h1>இன்றைய Quiz</h1>
  <p>இன்றைய சிறப்பு quiz இங்கே சேர்க்கப்படும்.</p>
  <a href="level1.html?from=today" class="back-btn">← திரும்பு</a>
</main>
<script>
  function updateDT() {
    const now = new Date();
    const days = ["ஞாயிறு","திங்கள்","செவ்வாய்","புதன்","வியாழன்","வெள்ளி","சனி"];
    const months = ["ஜனவரி","பிப்ரவரி","மார்ச்","ஏப்ரல்","மே","ஜூன்","ஜூலை","ஆகஸ்ட்","செப்டம்பர்","அக்டோபர்","நவம்பர்","டிசம்பர்"];
    const rawHr = now.getHours();
    const min = String(now.getMinutes()).padStart(2,'0');
    let ampm = rawHr < 4 ? "நள்ளிரவு" : rawHr < 12 ? "காலை" : rawHr < 17 ? "மதியம்" : rawHr < 20 ? "மாலை" : "இரவு";
    const hr = rawHr % 12 || 12;
    document.getElementById('nav-dt').textContent =
      '📅 ' + days[now.getDay()] + ', ' + now.getDate() + ' ' + months[now.getMonth()] + ' ' + now.getFullYear() +
      ' — ⏰ ' + ampm + ' ' + hr + ':' + min;
  }
  updateDT();
  setInterval(updateDT, 60000);
</script>
</body>
</html>
